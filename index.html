
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donovan - Assistant de Kylian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.35.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { GoogleGenAI, Modality } from '@google/genai';

        // --- DONNÉES DU CV & INSTRUCTIONS ---
        const KYLIAN_CV_DATA = `
        Nom: Kylian Perrault, 22 ans.
        Profil: Région parisienne. Passionné par le Web3, l'IA et la transformation digitale.
        Formations: 
        - MSc Manager des Entreprises et des Organisations (Startup) - Inseec Paris (2024-2026).
        - Bachelor Responsable du Développement Commercial - EBBS Business School (2021-2024).
        Expériences: 
        - Vice-Président Co-fondateur @ Kryptosphère INSEEC Paris.
        - Alternant Responsable Com/Marketing @ Paymium.
        - Micro-entrepreneur @ Azaios (Bijoux).
        - Conseiller de vente @ Goossens Paris (Chanel).
        - Assistant Commercial @ Manufacture Bordeaux (Unaju).
        Compétences: Stratégie digitale, Web3, Luxe, Marketing opérationnel.
        `;

        const SYSTEM_INSTRUCTION = `
        Tu es Donovan, l'assistant IA de Kylian Perrault. 
        Ton script d'ouverture est STRICTEMENT : "Bonjour, je suis Donovan, l'assistant de Kylian, que voulez-vous savoir à propos de lui ?"
        Ta personnalité : Professionnel, chaleureux, élégant. 
        Tu dois parler de Kylian à la 3ème personne. Réponds de manière concise.
        Utilise ces informations : ${KYLIAN_CV_DATA}
        `;

        // --- UTILITAIRES AUDIO (PCM RAW) ---
        function decodeBase64(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function encodeBase64(bytes) {
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
        }

        async function pcmToAudioBuffer(data, ctx, sampleRate, numChannels) {
            const dataInt16 = new Int16Array(data.buffer);
            const frameCount = dataInt16.length / numChannels;
            const buffer = ctx.createBuffer(numChannels, frameCount, sampleRate);
            for (let channel = 0; channel < numChannels; channel++) {
                const channelData = buffer.getChannelData(channel);
                for (let i = 0; i < frameCount; i++) {
                    channelData[i] = dataInt16[i * numChannels + channel] / 32768.0;
                }
            }
            return buffer;
        }

        const App = () => {
            const [isActive, setIsActive] = useState(false);
            const [isConnecting, setIsConnecting] = useState(false);
            const [messages, setMessages] = useState([]);
            
            const audioCtxRef = useRef(null);
            const outCtxRef = useRef(null);
            const nextStartTimeRef = useRef(0);
            const sourcesRef = useRef(new Set());
            const transcriptRef = useRef({ input: '', output: '' });
            const sessionPromiseRef = useRef(null);

            const stopSession = () => {
                setIsActive(false);
                setIsConnecting(false);
                if (audioCtxRef.current) audioCtxRef.current.close().catch(() => {});
                if (outCtxRef.current) outCtxRef.current.close().catch(() => {});
                sourcesRef.current.forEach(s => { try { s.stop(); } catch(e){} });
                sourcesRef.current.clear();
                sessionPromiseRef.current = null;
            };

            const startSession = async () => {
                if (isConnecting || isActive) return;
                setIsConnecting(true);

                try {
                    const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
                    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                    outCtxRef.current = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    const sessionPromise = ai.live.connect({
                        model: 'gemini-2.5-flash-native-audio-preview-12-2025',
                        callbacks: {
                            onopen: () => {
                                setIsActive(true);
                                setIsConnecting(false);
                                const source = audioCtxRef.current.createMediaStreamSource(stream);
                                const processor = audioCtxRef.current.createScriptProcessor(4096, 1, 1);
                                
                                processor.onaudioprocess = (e) => {
                                    const input = e.inputBuffer.getChannelData(0);
                                    const int16 = new Int16Array(input.length);
                                    for (let i = 0; i < input.length; i++) int16[i] = input[i] * 32768;
                                    
                                    sessionPromise.then(s => {
                                        s.sendRealtimeInput({ 
                                            media: { 
                                                data: encodeBase64(new Uint8Array(int16.buffer)), 
                                                mimeType: 'audio/pcm;rate=16000' 
                                            } 
                                        });
                                    }).catch(() => {});
                                };
                                source.connect(processor);
                                processor.connect(audioCtxRef.current.destination);
                            },
                            onmessage: async (msg) => {
                                if (msg.serverContent?.outputTranscription) transcriptRef.current.output += msg.serverContent.outputTranscription.text;
                                if (msg.serverContent?.inputTranscription) transcriptRef.current.input += msg.serverContent.inputTranscription.text;
                                
                                if (msg.serverContent?.turnComplete) {
                                    const { input, output } = transcriptRef.current;
                                    if (input || output) {
                                        setMessages(p => [...p, 
                                            input ? { role: 'user', text: input } : null, 
                                            output ? { role: 'assistant', text: output } : null
                                        ].filter(Boolean));
                                    }
                                    transcriptRef.current = { input: '', output: '' };
                                }

                                const audioBase64 = msg.serverContent?.modelTurn?.parts[0]?.inlineData?.data;
                                if (audioBase64 && outCtxRef.current) {
                                    const ctx = outCtxRef.current;
                                    nextStartTimeRef.current = Math.max(nextStartTimeRef.current, ctx.currentTime);
                                    const buffer = await pcmToAudioBuffer(decodeBase64(audioBase64), ctx, 24000, 1);
                                    const s = ctx.createBufferSource();
                                    s.buffer = buffer;
                                    s.connect(ctx.destination);
                                    s.onended = () => sourcesRef.current.delete(s);
                                    s.start(nextStartTimeRef.current);
                                    nextStartTimeRef.current += buffer.duration;
                                    sourcesRef.current.add(s);
                                }

                                if (msg.serverContent?.interrupted) {
                                    sourcesRef.current.forEach(s => { try { s.stop(); } catch(e){} });
                                    sourcesRef.current.clear();
                                    nextStartTimeRef.current = 0;
                                }
                            },
                            onerror: stopSession,
                            onclose: stopSession
                        },
                        config: {
                            responseModalities: [Modality.AUDIO],
                            systemInstruction: SYSTEM_INSTRUCTION,
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Charon' } } },
                            inputAudioTranscription: {},
                            outputAudioTranscription: {}
                        }
                    });
                    sessionPromiseRef.current = sessionPromise;
                } catch (e) {
                    console.error("Session failed:", e);
                    setIsConnecting(false);
                    stopSession();
                }
            };

            return React.createElement('div', { className: "flex flex-col h-screen max-w-5xl mx-auto p-4 md:p-10" }, [
                // Header
                React.createElement('header', { key: 'h', className: "flex items-center justify-between mb-10" }, [
                    React.createElement('div', { className: "flex items-center gap-5" }, [
                        React.createElement('div', { className: "w-14 h-14 rounded-2xl bg-indigo-600 flex items-center justify-center text-2xl font-black shadow-lg shadow-indigo-500/20" }, "D"),
                        React.createElement('div', null, [
                            React.createElement('h1', { className: "text-2xl font-bold text-white" }, "Donovan"),
                            React.createElement('p', { className: "text-slate-400 text-sm" }, "Assistant de Kylian Perrault")
                        ])
                    ]),
                    React.createElement('div', { className: "glass px-4 py-2 rounded-full flex items-center gap-2" }, [
                        React.createElement('div', { className: `w-2 h-2 rounded-full ${isActive ? 'bg-green-500 animate-pulse' : 'bg-slate-600'}` }),
                        React.createElement('span', { className: "text-[10px] font-bold uppercase tracking-widest" }, isActive ? 'Actif' : 'Hors ligne')
                    ])
                ]),

                // Main Area
                React.createElement('main', { key: 'm', className: "flex-1 flex flex-col gap-6 min-h-0" }, [
                    React.createElement('div', { className: "relative flex-1 rounded-[2.5rem] glass flex flex-col items-center justify-center p-8 text-center" }, 
                        !isActive && !isConnecting ? [
                            React.createElement('div', { className: "w-24 h-24 mx-auto bg-slate-900 rounded-full flex items-center justify-center text-4xl mb-6 shadow-2xl border border-white/5" }, "🎙️"),
                            React.createElement('h2', { className: "text-3xl font-bold mb-4" }, "Bonjour, je suis Donovan."),
                            React.createElement('p', { className: "text-slate-400 mb-8 max-w-sm mx-auto text-lg" }, "L'assistant intelligent de Kylian Perrault. Que voulez-vous savoir à propos de lui ?"),
                            React.createElement('button', { 
                                onClick: startSession,
                                className: "w-full max-w-xs py-4 bg-indigo-600 text-white rounded-2xl font-bold text-lg hover:bg-indigo-500 transition-all active:scale-95 shadow-xl shadow-indigo-600/20"
                            }, "Commencer l'échange")
                        ] : isConnecting ? [
                            React.createElement('div', { className: "w-16 h-16 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin mb-4" }),
                            React.createElement('p', { className: "animate-pulse text-slate-400 text-xl" }, "Chargement de Donovan...")
                        ] : [
                            React.createElement('div', { className: "relative w-56 h-56 rounded-full border-2 border-white/5 flex items-center justify-center" }, [
                                React.createElement('div', { className: "absolute inset-0 border border-indigo-500/40 rounded-full pulse" }),
                                React.createElement('div', { className: "w-40 h-40 rounded-full bg-slate-900 flex items-center justify-center shadow-inner border border-white/10" }, 
                                    React.createElement('div', { className: "flex gap-1.5 items-end h-12" }, [1,2,3,4,5].map(i => 
                                        React.createElement('div', { key: i, className: "w-2 bg-indigo-500 rounded-full animate-bounce", style: { height: `${30 + Math.random()*70}%`, animationDuration: `${0.6 + Math.random()}s` } })
                                    ))
                                )
                            ]),
                            React.createElement('p', { className: "mt-10 text-2xl font-bold text-white" }, "Je vous écoute..."),
                            React.createElement('button', { 
                                onClick: stopSession,
                                className: "mt-10 px-10 py-3 bg-red-600/20 text-red-500 rounded-2xl font-bold hover:bg-red-600 hover:text-white transition-all border border-red-500/20"
                            }, "Terminer l'appel")
                        ]
                    ),

                    // Transcripts
                    messages.length > 0 && React.createElement('div', { className: "h-48 glass rounded-[2rem] p-6 overflow-y-auto space-y-4 border border-white/5 shadow-inner" }, 
                        messages.map((m, i) => React.createElement('div', { key: i, className: `flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}` }, 
                            React.createElement('div', { className: `max-w-[85%] px-5 py-3 rounded-2xl text-sm ${m.role === 'user' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-800 text-slate-200 shadow-md'}` }, [
                                React.createElement('p', { className: "text-[10px] font-black uppercase tracking-widest opacity-40 mb-1" }, m.role === 'user' ? 'Vous' : 'Donovan'),
                                React.createElement('p', null, m.text)
                            ])
                        ))
                    )
                ]),

                // Footer Stats
                React.createElement('footer', { key: 'f', className: "mt-8 grid grid-cols-2 md:grid-cols-4 gap-4" }, 
                    [
                        { l: 'MSc Inseec', v: 'Manager Startup' },
                        { l: 'Alternance', v: 'Paymium (Com)' },
                        { l: 'Expertise', v: 'Web3 & Luxe' },
                        { l: 'Région', v: 'Île-de-France' }
                    ].map((item, i) => 
                        React.createElement('div', { key: i, className: "glass p-4 rounded-2xl border border-white/5" }, [
                            React.createElement('p', { className: "text-[10px] text-slate-500 uppercase font-black tracking-widest mb-1" }, item.l),
                            React.createElement('p', { className: "text-sm font-bold text-slate-200 truncate" }, item.v)
                        ])
                    )
                )
            ]);
        };

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
